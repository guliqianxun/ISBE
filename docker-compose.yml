name: isbe

# Server / prod-like layout: only Prefect :4200 is published to the host.
# All other services talk over the internal `isbe-net` bridge network.
#
# For local dev on Windows that needs the MinIO/Phoenix/RSSHub UIs,
# `docker-compose.override.yml` re-publishes those ports automatically.
# Disable the override on the server with:
#   docker compose -f docker-compose.yml up -d
# (omitting -f makes Compose auto-merge the override).

networks:
  isbe-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: isbe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-isbe}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `prefect` database on first boot of a fresh volume.
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isbe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [isbe-net]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: isbe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-isbe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [isbe-net]

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: isbe-phoenix
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenixdata:/mnt/data
    restart: unless-stopped
    networks: [isbe-net]

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: isbe-prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-isbe}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"   # only port published to the host
    restart: unless-stopped
    healthcheck:
      # Prefect 3's image ships Python + httpx; curl is not installed. Probes
      # the API's own readiness endpoint — if it goes silent the container is
      # marked unhealthy and dependents (worker) react.
      test:
        - "CMD"
        - "python"
        - "-c"
        - >-
          import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen(
              'http://localhost:4200/api/health', timeout=5).status == 200
          else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [isbe-net]

  # RSSHub — turns sites without native RSS (知乎/微博/B站/小红书/微信公众号/...)
  # into RSS feeds the generic rss_collector can ingest.
  # Routes catalog: https://docs.rsshub.app/
  rsshub:
    image: diygod/rsshub:latest
    container_name: isbe-rsshub
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: "3600"
      # KOL routes that need cookies (zhihu/weibo) — populate via .env if needed:
      ZHIHU_COOKIES: ${ZHIHU_COOKIES:-}
      WEIBO_COOKIES: ${WEIBO_COOKIES:-}
    restart: unless-stopped
    networks: [isbe-net]

  # morerssplz — lilydjwg/morerssplz, zero-cookie Zhihu 专栏 (/zhuanlan) feeds.
  # Used as a no-auth fallback for `/zhihu/zhuanlan/<slug>` when RSSHub gets
  # 403'd by Zhihu risk-control. Does NOT cover /topic or /people routes.
  # Route shape: GET /zhihuzhuanlan/<column-slug>  (note: no slash between
  # "zhihu" and "zhuanlan"). Upstream listens on :8000.
  morerssplz:
    # Pinned to a commit: an unpinned git build would execute whatever is on
    # upstream HEAD at image-build time, inside this network.
    build: https://github.com/lilydjwg/morerssplz.git#4f34f7c3ab256059559f328b1cb7e94b73165db4
    container_name: isbe-morerssplz
    restart: unless-stopped
    networks: [isbe-net]

  # radar-worker: long-lived Prefect worker that fires the cron-scheduled flows.
  # Opt-in: `docker compose --profile worker up -d`
  #
  # On Linux server: the bind mounts below resolve to ./memory etc relative to
  # the directory you run `docker compose` from. Make sure that directory holds
  # the repo (or at least the memory/ papers/ artifacts/ subdirs).
  #
  # On Docker Desktop Windows: enable F: drive (or whichever drive holds this
  # repo) under Settings -> Resources -> File sharing.
  radar-worker:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: isbe/radar:latest
    container_name: isbe-radar-worker
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-isbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-isbe}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-isbe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123}
      PREFECT_API_URL: http://prefect-server:4200/api
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-isbe}
      ISBE_LLM_PROVIDER: ${ISBE_LLM_PROVIDER:-deepseek}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      METRAIL_API_URL: ${METRAIL_API_URL:-}
      ISBE_UID: ${ISBE_UID:-me}
      ISBE_SMTP_HOST: ${ISBE_SMTP_HOST:-}
      ISBE_SMTP_PORT: ${ISBE_SMTP_PORT:-587}
      ISBE_SMTP_FROM: ${ISBE_SMTP_FROM:-}
      ISBE_SMTP_TO: ${ISBE_SMTP_TO:-}
      ISBE_SMTP_USER: ${ISBE_SMTP_USER:-}
      ISBE_SMTP_PASS: ${ISBE_SMTP_PASS:-}
      ISBE_SMTP_ALLOW_PLAINTEXT: ${ISBE_SMTP_ALLOW_PLAINTEXT:-}
    volumes:
      - ./memory:/app/memory
      - ./papers:/app/papers
      - ./artifacts:/app/artifacts
      - ./src:/app/src
      - ./alembic:/app/alembic
    command: ["scheduler", "serve"]
    restart: unless-stopped
    networks: [isbe-net]

volumes:
  pgdata:
  miniodata:
  phoenixdata:

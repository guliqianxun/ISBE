name: isbe

# Server-side overlay for the LAN deployment on 192.168.0.156.
# Use INSTEAD OF docker-compose.override.yml (which is for Windows local dev).
#
# Layout assumptions:
#   - Repo cloned to /mnt/nas_iscsi/isbe/
#   - Docker daemon data-root is already on /mnt/nas_iscsi/docker/, so named
#     volumes (pgdata / miniodata / phoenixdata) automatically live on the
#     iSCSI LUN — we only need to bind-mount the human-visible directories
#     (memory / papers / artifacts) here.
#   - All UIs are bound to 192.168.0.156 explicitly so they're reachable from
#     LAN but not from the public internet (assumes server has no public IP).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml \
#     --profile worker up -d --build

services:
  postgres:
    environment:
      # Server deployment must not run with the dev default password —
      # postgres is published on the LAN below. Fail at `compose config` time.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for the server deployment}
    ports:
      - "192.168.0.156:5432:5432"

  minio:
    ports:
      - "192.168.0.156:9000:9000"
      - "192.168.0.156:9001:9001"

  phoenix:
    ports:
      - "192.168.0.156:6006:6006"

  # prefect-server already publishes 4200:4200 from the base compose file
  # (default 0.0.0.0) — fine on a LAN-only server with no public IP.

  # Single-page hub linking all ISBE services. Open http://192.168.0.156:8082
  # as the daily landing page; everything else is one click away.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: isbe-homepage
    environment:
      # Permissive — LAN-only deployment, no need for strict host check
      HOMEPAGE_ALLOWED_HOSTS: "*"
    volumes:
      # Not :ro — homepage needs to mkdir /app/config/logs at startup
      - ./infra/homepage:/app/config
    ports:
      - "192.168.0.156:8082:3000"
    restart: unless-stopped
    networks: [isbe-net]

  # Browser-based file manager — serves /mnt/nas_iscsi/isbe over HTTP so the
  # homepage hub can deep-link to PDFs / artifacts / memory without smb://.
  # Auth REQUIRED: this tree contains memory/ (private theses) and possibly
  # .env. First login is admin / admin — change the password immediately.
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: isbe-filebrowser
    # user: "1000:1000"  # uncomment & match /mnt/nas_iscsi/isbe ownership if
    #                      the default non-root user can't read the NAS files
    volumes:
      - /mnt/nas_iscsi/isbe:/srv
      - ./infra/filebrowser:/config
    environment:
      FB_DATABASE: /config/filebrowser.db
      FB_ROOT: /srv
      FB_PORT: "80"
    ports:
      - "192.168.0.156:8084:80"
    restart: unless-stopped
    networks: [isbe-net]

  # Browser-based SQL UI for postgres. pgweb has no auth of its own, so it is
  # bound to the server's loopback only — access via SSH tunnel:
  #   ssh -L 8083:127.0.0.1:8083 <server> ; then open http://localhost:8083
  # (8081 is taken by zotero-webdav on this host; 8082 is homepage.)
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: isbe-pgweb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-isbe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-isbe}?sslmode=disable
    ports:
      - "127.0.0.1:8083:8081"
    restart: unless-stopped
    networks: [isbe-net]

  radar-worker:
    build:
      args:
        # CN-friendly PyPI mirror; override or empty to use upstream
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - /mnt/nas_iscsi/isbe/memory:/app/memory
      - /mnt/nas_iscsi/isbe/papers:/app/papers
      - /mnt/nas_iscsi/isbe/artifacts:/app/artifacts

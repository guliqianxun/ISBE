<p>2026年10月16日，国家开发银行将通过外汇交易中心发行系统线上簿记发行托管在上海清算所的绿色金融债券。本期债券发行规模为不超过80亿元，发行期限为3年。本期债券定性为政策性金融债券，由国家给予信用支持。诚邀投资人认购询价。</p>

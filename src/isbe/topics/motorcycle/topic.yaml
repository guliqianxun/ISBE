id: motorcycle
label: 200cc+ 摩托车周报
cadence: weekly
active: true

rss:
  feeds:
    # Probed 2026-05-13: these three publish daily and return clean RSS 2.0.
    - name: ultimatemotorcycling
      url: https://ultimatemotorcycling.com/feed/
    - name: totalmotorcycle
      url: https://www.totalmotorcycle.com/feed
    - name: bikesrepublic
      url: https://www.bikesrepublic.com/feed/
    # Sources probed but skipped: asphaltandrubber (feed dead since 2025-04),
    # rideapart (/rss/ is HTML index, not feed), cycleworld (TLS handshake fails
    # from this network), motorcycle.com (403), revzilla / gearpatrol (HTML).
    #
    # Chinese KOL feeds via local RSSHub (rsshub container in docker-compose).
    # Uncomment after populating ZHIHU_COOKIES / WEIBO_COOKIES in .env;
    # routes WITHOUT cookies return 503 from zhihu/weibo/bilibili anti-bot.
    # Replace <uid> with the target account's numeric ID (visit profile,
    # the trailing digits in URL are the uid). Use `rsshub:1200` if running
    # the radar-worker container (docker compose --profile worker), else
    # `localhost:1200` from host.
    # - name: zhihu_motorcycle_topic
    #   url: http://localhost:1200/zhihu/topic/19551770    # 知乎"摩托车"话题
    # - name: zhihu_kol_<name>
    #   url: http://localhost:1200/zhihu/people/answers/<uid>
    # - name: weibo_kol_<name>
    #   url: http://localhost:1200/weibo/user/<uid>
    # - name: bilibili_kol_<name>
    #   url: http://localhost:1200/bilibili/user/video/<uid>
  # No include_keywords — dedicated moto media means every entry is on-topic.
  # LLM does relevance filtering in 文章逐条 evaluation.
  exclude_url_patterns:
    - "/bm/"   # bikesrepublic publishes EN + Bahasa Malaysia versions; keep EN only
  exclude_keywords:
    - "scooter"
    - "moped"
    - "50cc"
    - "125cc"
    - "e-bike"
    - "electric kick"
  lookback_days: 14
  lang: en

# Crawl4AI: real Chromium fetch + LLM-driven extraction for JS-rendered /
# anti-bot sites that RSS can't reach. Uncomment + fill URLs to enable.
# Cost: ~$0.001-0.003 per page (DeepSeek LLM extraction).
# Caveat: 知乎 risk control blocks even logged-in headless Chrome on many
# /topic/ URLs — works for cookies-friendly sites (雪球 / 36 氪 /
# motorcycle.com / 各国际媒体) without further work.
# crawl4ai:
#   pages:
#     - name: motorcycle_com_news
#       url: https://www.motorcycle.com/news
#     - name: xueqiu_motorcycle
#       url: https://xueqiu.com/k?q=摩托车
#   lookback_days: 14
#   lang: zh

digest:
  facts_window_days: 7

schedules:
  rss_collector: "0 6 * * *"           # 每日 06:00（积累一周）
  digester: "0 8 * * 1"                # 周一 08:00 出周报

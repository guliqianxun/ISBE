id: nowcasting
label: 临近降水预报科研订阅
cadence: weekly
active: true

arxiv:
  # physics.ao-ph 是降水临近预报论文的主阵地；cs.LG/eess.IV 补充方法/影像向。
  categories: [physics.ao-ph, cs.LG, eess.IV]
  include_keywords:
    - nowcasting
    - precipitation
    - rainfall
    - "radar echo"   # 气象雷达专指；去掉裸 radar（军用/车载 LiDAR 多义污染采集）
    - QPE
  max_results: 100

digest:
  flavor: weekly
  facts_window_days: 7
  include_repos: true   # 唯一启用 github repo 跟踪的 topic

# metrail-web 全文提取（局域网服务，METRAIL_API_URL 未设时自动跳过）。
metrail:
  enabled: true

# Cron schedules (used by scheduler.py to register Prefect deployments).
schedules:
  arxiv_collector: "0 6 * * *"           # 每日 06:00
  github_collector: "30 6 * * *"         # 每日 06:30 (nowcasting only)
  arxiv_download_pdfs: "0 7 * * 1"       # 周一 07:00
  metrail_enrich: "20 7 * * 1"           # 周一 07:20（PDF 下载后、digest 前）
  digester: "0 8 * * 1"                  # 周一 08:00

# 检索契约：digester 对本域 facts 套相关性门(out_of_scope/require_any)+优先级分层。
# source: facts = 读 ISBE Postgres(服务器自己 arxiv 采集填充)。gates 可改、偏召回，首次上线后 smoke 调。
retrieval:
  source: facts
  intent: "降水临近预报为核心(0–6h 雷达回波外推/深度学习/生成式短临)，并涵盖降水相关的降尺度/卫星估计/集合后处理/洪水/QPE/归因——核心置顶，相关次级"
  in_scope:
    - 降水 / 对流 0–6h 短临预报方法（核心）
    - 雷达回波外推（光流 / 深度学习 / 生成式）
    - 深度学习 / 扩散 / 生成式临近预报（DGMR / MetNet / NowcastNet 系）
    - 降水降尺度、卫星 / 多源降水估计、S2S / 集合后处理、洪水 nowcasting、QPE / 归因
    - 评测指标、benchmark、数据集
  out_of_scope:
    - 军用 / 传感 / 生物医学雷达（目标跟踪 / RCS / 心率 / 手势 / 无人机 / 船舶）
    - 经济 / 金融 / 疾病 / 地震 / 藻华 nowcasting（同名异域）
    - 纯流体力学 / 传热数值模拟
  facets: [radar-extrapolation, deep-learning-nowcasting, generative-diffusion,
           transformer-spatiotemporal, satellite-multisource, downscaling, flood, eval-benchmark]
  secondary_terms: [downscaling, downscale, satellite, "inter-satellite", S2S, sub-seasonal,
                    subseasonal, seasonal, flood, QPE, attribution, runoff, postprocessing,
                    "ensemble post", reanalysis, climate, teleconnection]
  # 匹配标题(scorer)，命中即弃。人工影响天气/气溶胶注入=干预非预报；遥感淹没制图/气候仿真=非临近预报。
  out_of_scope_keywords: [GDP, economic, macroeconomic, financial, influenza, epidemic, COVID,
                          disease, earthquake, "algal bloom", "heart rate", "vital sign", missile,
                          "sign language", "vessel classification", RCS, "gesture recognition",
                          "proton accelerator", "cloud seeding", "weather modification",
                          "stratospheric aerosol injection", ionization,
                          "flood segmentation", "flood mapping", "inundation mapping",
                          "stratospheric warming", "scenario design",
                          "autonomous driving", "driving perception", "perception test"]
  # 匹配标题(scorer)。去掉裸 radar(多义)。气候降尺度/RCM 仿真(climate downscaling/emulation)是气候投影
  # 时间尺度、非 0–6h 临近预报——故 require_any 不收 downscaling/emulation；真·降水降尺度论文标题多含
  # precipitation/rainfall 自会命中。flood 留(洪水预报)，遥感淹没制图/AV-rainfall 由上面负向门剔除。
  require_any: [precipitation, rainfall, reflectivity, "radar echo", "echo extrapolation",
                "weather radar", "precipitation forecast", "precipitation nowcast",
                "precipitation prediction", QPE, DGMR, MetNet, NowcastNet, "convective storm",
                "rain rate", "quantitative precipitation", meteorolog, hydrometeor, flood]
  must_not_miss:
    - 本期新发布的主流降水临近预报 SOTA / 新方法
    - 公开 benchmark 榜首易主
  quality_bar: "好论文 = 有方法/架构贡献或 SOTA/benchmark/公开代码；非纯个例应用、非同名异域 nowcasting"

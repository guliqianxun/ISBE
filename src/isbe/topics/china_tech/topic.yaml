id: china-tech
label: 国内科技 / 创投周报
cadence: weekly
active: true

rss:
  feeds:
    # 36 氪官方 RSS — 验证 2026-05-14 ：HTTP 200，单次返回 30 items，
    # 覆盖 ~28 小时；混合长文章（/p/<id>）+ 快讯（/newsflashes/<id>）。
    - name: 36kr
      url: https://36kr.com/feed
  # Note: 36 氪 feed 只滚 28 小时，每日 cron 才能覆盖一周窗口。

    # 知乎专栏（通过 morerssplz 无需 cookies）—— 验证 2026-05-15
    # 路由形如 `/zhihuzhuanlan/<slug>`（中间无斜杠）。每次 20 items。
    # morerssplz 只覆盖 /zhuanlan；topic/people 仍需 RSSHub + 完整 cookie jar
    # （见 docs/howto/zhihu-cookies.md）。新增专栏先用
    # `uv run python scripts/probe_morerssplz.py` 试一下，注意 pubDate
    # 要近 14 天内，否则被 lookback_days 过滤掉（如停更的 `aiera`）。
    #
    # URL base 由 MORERSSPLZ_URL 决定，缺省用 docker 服务名（容器内可达）：
    #   - 服务器 / `docker compose` 本地栈：不设 → http://morerssplz:8000
    #   - 开发机直接 `uv run radar ...`（不进容器）：在 .env 设
    #     MORERSSPLZ_URL=http://localhost:1201（override 把 morerssplz 映射到 1201）
    - name: zhihu_jiqizhixin
      url: ${MORERSSPLZ_URL:-http://morerssplz:8000}/zhihuzhuanlan/jiqizhixin   # 机器之心 — research summaries
    - name: zhihu_qbitai
      url: ${MORERSSPLZ_URL:-http://morerssplz:8000}/zhihuzhuanlan/qbitai       # 量子位 — applied AI / products
  exclude_keywords:
    # 招商引资类硬广 / 平台运营帖：留干净的资讯
    - "招商"
    - "入驻"
    - "广告"
    - "VClub"
  lookback_days: 14
  lang: zh

# Crawl4AI scaffold（暂不启用）：留给后面接 雪球 / 虎嗅 / 少数派 等无 RSS 站。
# crawl4ai:
#   pages:
#     - name: xueqiu_7x24
#       url: https://xueqiu.com/today
#   lookback_days: 7
#   lang: zh

digest:
  facts_window_days: 7

schedules:
  rss_collector: "0 6 * * *"             # 每日 06:00（积累一周）
  digester: "0 9 * * 1"                  # 周一 09:00 出周报

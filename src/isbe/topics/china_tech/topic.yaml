id: china-tech
label: 国内科技 / 创投周报
cadence: weekly
active: true

rss:
  feeds:
    # 36 氪官方 RSS — 验证 2026-05-14 ：HTTP 200，单次返回 30 items，
    # 覆盖 ~28 小时；混合长文章（/p/<id>）+ 快讯（/newsflashes/<id>）。
    - name: 36kr
      url: https://36kr.com/feed
  # Note: 36 氪 feed 只滚 28 小时，每日 cron 才能覆盖一周窗口。
    # 知乎专栏 / 话题 / 大 V 回答 —— 需要 ZHIHU_COOKIES 含 `d_c0=...; z_c0=...`，
    # 详见 docs/howto/zhihu-cookies.md。粘贴 cookies 后 docker compose up -d --force-recreate rsshub，
    # 跑 `uv run python scripts/probe_zhihu_routes.py` 全部 200 即可解开下面 3 行：
    # - name: zhihu_zhuanlan_<column>
    #   url: http://localhost:1200/zhihu/zhuanlan/<column-slug>
    # - name: zhihu_topic_<topic_label>
    #   url: http://localhost:1200/zhihu/topic/<topic-id>/top-answers
    # - name: zhihu_user_<urlToken>
    #   url: http://localhost:1200/zhihu/people/answers/<urlToken>
  exclude_keywords:
    # 招商引资类硬广 / 平台运营帖：留干净的资讯
    - "招商"
    - "入驻"
    - "广告"
    - "VClub"
  lookback_days: 14
  lang: zh

# Crawl4AI scaffold（暂不启用）：留给后面接 雪球 / 虎嗅 / 少数派 等无 RSS 站。
# crawl4ai:
#   pages:
#     - name: xueqiu_7x24
#       url: https://xueqiu.com/today
#   lookback_days: 7
#   lang: zh

digest:
  facts_window_days: 7

schedules:
  rss_collector: "0 6 * * *"             # 每日 06:00（积累一周）
  china_tech_digester: "0 9 * * 1"       # 周一 09:00 出周报
